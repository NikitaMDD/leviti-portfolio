# Ивенты для секции "Ивенты" на главной.
#
# Поля:
#   id       — уникальный слаг, любой (латиницей)
#   date     — дата начала вечера, ГГГГ-ММ-ДД (ночь 26→27 = 26-е)
#   title    — название вечеринки или площадки
#   venue    — площадка, если title — название вечеринки (необязательно)
#   city     — город
#   role     — headline | b2b | warm-up | closing | showcase | resident (необязательно)
#   tickets  — ссылка на билеты; есть ссылка — есть кнопка "Билеты"
#   post     — ссылка на пост/рилс; есть ссылка — есть кнопка "Пост"
#   tbc      — true, пока название/дата не уточнены (в строке будет метка "уточняется")
#
# Будущие и прошедшие делятся автоматически по дате при сборке.
#
# Пример будущего ивента:
# - id: some-party-2026-11
#   date: 2026-11-14
#   title: Название вечеринки
#   venue: Клуб
#   city: Москва
#   role: headline
#   tickets: https://example.com/tickets

