name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # ежедневная пересборка — ивенты делятся на "скоро"/"прошедшие" по дате
  # в момент сборки (src/components/EventsSection.astro). 21:05 UTC = 00:05 МСК
  schedule:
    - cron: "5 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          node-version: "22"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
